name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task3-web .

      - name: Check image size
        run: |
          SIZE=$(docker image inspect task3-web --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -ge 150 ]; then
            echo "Image is too large"
            exit 1
          fi

      - name: Start services
        run: docker compose up -d

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Test persistence
        run: |
          curl -X POST http://localhost:5000/visit
          curl http://localhost:5000/visits

      - name: Verify non-root user
        run: |
          USER_ID=$(docker compose exec -T web id -u)
          echo "Container user ID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "Container is running as root"
            exit 1
          fi

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
